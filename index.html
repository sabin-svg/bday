<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hey My Beautiful ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{ margin:0; padding:0; box-sizing:border-box; }

body{
  height:100vh; width:100vw;
  background: radial-gradient(circle at center, #ff4d88, #ff0066, #b30047);
  display:flex; align-items:center; justify-content:center;
  font-family:'Poppins',sans-serif;
  position:relative;
  overflow:hidden;
  color:#fff;
}

/* Pink transparent glow */
body::after{
  content:""; position:absolute; inset:0;
  background:rgba(255, 100, 150, 0.28);
  backdrop-filter:blur(2px);
}

/* Main glass card */
.main{
  position:relative; z-index:10;
  background:rgba(255,255,255,0.1);
  padding:35px 40px;
  border-radius:20px;
  backdrop-filter:blur(8px);
  box-shadow:0 0 35px rgba(255,0,120,0.5);
  text-align:center;
  animation:fadeIn 1.2s ease forwards;
}

@keyframes fadeIn{
  from{ opacity:0; transform:scale(0.9); }
  to{ opacity:1; transform:scale(1); }
}

h1{
  font-family:'Great Vibes',cursive;
  font-size:50px;
  margin-bottom:10px;
  text-shadow:0 0 30px rgba(255,150,200,0.8);
}

p{
  color:#ffe4ec;
  margin-bottom:20px;
}

/* Input */
input{
  padding:12px 18px;
  border:none;
  border-radius:12px;
  background:rgba(255,255,255,0.25);
  color:#fff;
  width:250px;
  text-align:center;
  outline:none;
  margin-bottom:20px;
  font-size:16px;
  box-shadow:0 0 12px rgba(255,150,200,0.4);
}

button{
  padding:12px 26px;
  border:none;
  border-radius:30px;
  background:linear-gradient(90deg,#ff2f4b,#ff6b81);
  color:white;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 0 25px rgba(255,80,120,0.7);
  transition:0.3s;
}

button:hover{
  transform:scale(1.08);
}

/* Live floating hearts */
.heart{
  position:fixed;
  font-size:22px;
  color:pink;
  pointer-events:none;
  animation:fly 4s linear forwards;
  opacity:0.8;
}

@keyframes fly{
  0% { transform:translateY(100vh) scale(0.8); opacity:0.9; }
  100% { transform:translateY(-20vh) scale(1.8); opacity:0; }
}
</style>
</head>
<body>

<audio id="bgMusic" loop>
  <source src="assets/music.mp3" type="audio/mpeg">
</audio>

<div class="main">
  <h1>Hey My Beautiful ❤️</h1>
  <p>Before we start this surprise, tell me your sweet name 💕</p>

  <input type="text" id="name" placeholder="Type your name...">

  <button onclick="next()">Continue ➜</button>
  <small style="display:block;margin-top:10px;color:#ffdce4;">(Tap anywhere if music doesn't start)</small>
</div>

<script>
const music = document.getElementById("bgMusic");

// Auto play music on first tap
document.addEventListener("click", () => {
 music.volume = 0.4;
 music.play().catch(()=>{});
}, { once:true });

// Save name + go to cake page
function next(){
  let n = document.getElementById("name").value.trim();
  if(!n){ n = "My Love"; }
  localStorage.setItem("bdayName", n);
  window.location.href = "cake.html";
}

// Floating pink hearts
function spawnHearts(){
  let h = document.createElement("div");
  h.className = "heart";
  h.innerHTML = "❤️";

  h.style.left = Math.random()*window.innerWidth + "px";
  h.style.bottom = "-20px";

  document.body.appendChild(h);

  setTimeout(()=>h.remove(), 4000);
}

// create hearts every 250ms
setInterval(spawnHearts, 250);
</script>

</body>
</html>
