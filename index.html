<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome Princess 💖</title>
<style>
body {
  margin:0;
  height:100vh;
  background:radial-gradient(circle at top,#ff6b81,#400000);
  color:white;
  font-family:"Poppins",sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  overflow:hidden;
}
h1{font-size:2.3em;margin-bottom:10px}
input{
  padding:10px 16px;
  border:none;
  border-radius:8px;
  font-size:1em;
  outline:none;
}
button{
  margin-top:14px;
  padding:10px 20px;
  border:none;
  border-radius:10px;
  background:#ff3c58;
  color:white;
  font-weight:bold;
  cursor:pointer;
  font-size:1em;
  transition:0.3s;
}
button:hover{background:#ff667d}
.hearts span{
  position:absolute;
  font-size:24px;
  animation:float 6s linear infinite;
  opacity:0.7;
}
@keyframes float{
  from{transform:translateY(100vh) scale(1);}
  to{transform:translateY(-10vh) scale(1.4);opacity:0;}
}
</style>
</head>
<body>
<h1>Hey Beautiful 💕</h1>
<p>What's your name, Princess?</p>
<input type="text" id="name" placeholder="Type your name here">
<button onclick="saveName()">Continue ❤️</button>

<div class="hearts"></div>

<script>
function saveName(){
  let n=document.getElementById('name').value.trim();
  if(!n){n="Princess";}
  localStorage.setItem("bdayName",n);
  window.location.href="cake.html";
}
// floating hearts
const hearts=document.querySelector('.hearts');
for(let i=0;i<20;i++){
  const span=document.createElement('span');
  span.textContent='❤️';
  span.style.left=Math.random()*100+'vw';
  span.style.animationDelay=Math.random()*5+'s';
  hearts.appendChild(span);
}
</script>
</body>
</html>
