<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Princess 💞</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  height:100vh;
  width:100%;
  overflow:hidden;
  font-family:'Poppins',sans-serif;
  color:#fff;
  background:radial-gradient(circle at bottom,#ff3c58 0%,#400000 80%);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  position:relative;
}

/* animated hearts background */
.heart{
  position:absolute;
  color:#ffccd5;
  animation: floatUp 10s linear infinite;
  opacity:0.7;
}
@keyframes floatUp{
  0%{transform:translateY(100vh) scale(1);}
  100%{transform:translateY(-10vh) scale(1.5);opacity:0;}
}

/* glowing particles */
.particles{
  position:absolute;
  inset:0;
  background:radial-gradient(circle at 20% 80%,rgba(255,255,255,0.1) 0%,transparent 60%),
              radial-gradient(circle at 80% 20%,rgba(255,255,255,0.08) 0%,transparent 60%);
  animation:bgShift 6s infinite alternate;
}
@keyframes bgShift{
  0%{filter:hue-rotate(0deg);}
  100%{filter:hue-rotate(45deg);}
}

h1{
  font-family:'Great Vibes',cursive;
  font-size:3.2em;
  margin-bottom:8px;
  animation:fadeInDown 1.5s ease forwards;
}
@keyframes fadeInDown{
  from{opacity:0;transform:translateY(-40px);}
  to{opacity:1;transform:translateY(0);}
}
p{
  font-size:1.2em;
  margin-bottom:20px;
  opacity:0;
  animation:fadeIn 2s ease forwards;
  animation-delay:1s;
}
@keyframes fadeIn{
  to{opacity:1;}
}

input{
  padding:12px 18px;
  border:none;
  border-radius:10px;
  font-size:1em;
  outline:none;
  text-align:center;
  box-shadow:0 0 15px rgba(255,255,255,0.2);
  margin-bottom:16px;
  background:rgba(255,255,255,0.2);
  color:white;
}
input::placeholder{color:#ffe4e8}

button{
  padding:12px 26px;
  border:none;
  border-radius:30px;
  font-size:1.1em;
  background:linear-gradient(90deg,#ff496c,#ff859b);
  color:white;
  font-weight:600;
  cursor:pointer;
  transition:0.4s;
  box-shadow:0 0 20px rgba(255,107,129,0.4);
}
button:hover{
  transform:scale(1.05);
  box-shadow:0 0 30px rgba(255,107,129,0.8);
}

/* small love quote bottom */
.quote{
  position:absolute;
  bottom:25px;
  font-style:italic;
  color:#ffd6d6;
  font-size:1em;
  opacity:0.9;
}
</style>
</head>
<body>

<div class="particles"></div>

<h1>Hey My Beautiful ❤️</h1>
<p>Before we start this surprise, tell me your name Princess 💕</p>

<input type="text" id="name" placeholder="Type your name here...">
<button onclick="saveName()">Continue ➜</button>

<div class="quote">“Every heartbeat of mine says your name.”</div>

<script>
// Save name and move to cake page
function saveName(){
  let n=document.getElementById('name').value.trim();
  if(!n){n="Princess";}
  localStorage.setItem("bdayName",n);
  window.location.href="cake.html";
}

// Floating hearts background
for(let i=0;i<25;i++){
  let span=document.createElement("span");
  span.classList.add("heart");
  span.textContent="❤️";
  span.style.left=Math.random()*100+"vw";
  span.style.fontSize=(Math.random()*20+16)+"px";
  span.style.animationDuration=(5+Math.random()*5)+"s";
  span.style.animationDelay=Math.random()*5+"s";
  document.body.appendChild(span);
}
</script>
</body>
</html>
