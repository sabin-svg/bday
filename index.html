<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hey My Beautiful ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  height:100vh;
  width:100vw;
  background:url("images/Heart-shape-tree-with-red-leaves-on-red-flower-field.jpg") center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;
  font-family:'Poppins',sans-serif;
  position:relative;text-align:center;color:#fff;
}
body::after{
  content:"";position:absolute;inset:0;
  background:rgba(0,0,0,0.35);backdrop-filter:blur(2px);
}
.main{
  position:relative;z-index:10;
  background:rgba(255,255,255,0.06);
  padding:32px 38px;border-radius:18px;
  backdrop-filter:blur(6px);
  box-shadow:0 0 30px rgba(0,0,0,0.5);
}
h1{
  font-family:'Great Vibes',cursive;
  font-size:44px;margin-bottom:10px;
}
p{margin-bottom:20px;color:#ffe9ef;}
input{
  padding:12px 18px;border:none;border-radius:10px;
  background:rgba(255,255,255,0.22);color:white;
  width:230px;text-align:center;margin-bottom:20px;outline:none;
}
button{
  padding:12px 26px;border:none;border-radius:30px;
  background:linear-gradient(90deg,#ff2f4b,#ff6b81);
  color:white;font-weight:600;cursor:pointer;
  box-shadow:0 0 18px rgba(255,80,120,0.7);
  transition:0.3s;
}
button:hover{transform:scale(1.05);}
small{display:block;margin-top:8px;color:#ffdce4;}
</style>
</head>
<body>

<audio id="bgMusic" loop>
  <source src="assets/music.mp3" type="audio/mpeg">
</audio>

<div class="main">
  <h1>Hey My Beautiful ❤️</h1>
  <p>Before we start this surprise, tell me your name Princess 💕</p>

  <input type="text" id="name" placeholder="Type your name...">
  
  <button onclick="next()">Continue ➜</button>
  <small>(Tap anywhere if music doesn't start)</small>
</div>

<script>
const music = document.getElementById("bgMusic");

// Try autoplay
document.addEventListener("click", () => {
 music.volume = 0.35;
 music.play().catch(()=>{});
}, { once:true });

function next(){
  let n = document.getElementById("name").value.trim();
  if(!n){n = "My Love";}
  localStorage.setItem("bdayName", n);
  music.play();
  window.location.href = "cake.html";
}
</script>

</body>
</html>
