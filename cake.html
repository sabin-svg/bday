<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cake ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;padding:0;
  height:100vh;width:100vw;
  background:url("images/Heart-shape-tree-with-red-leaves-on-red-flower-field.jpg") center/cover no-repeat;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;color:#fff;font-family:'Poppins',sans-serif;
  position:relative;
}
body::after{
  content:"";position:absolute;inset:0;
  background:rgba(0,0,0,0.45);backdrop-filter:blur(2px);
}

.content{position:relative;z-index:10;}

h1{
  font-family:'Great Vibes',cursive;font-size:52px;margin-bottom:10px;
  color:#ffdce9;text-shadow:0 0 20px rgba(255,60,120,0.6);
}
p{margin-bottom:18px;color:#ffe5eb;}

.cakeBox{
  position:relative;
  width:330px;
  height:auto;
}

#cakeImage{
  width:100%;
  border-radius:20px;
  transition:0.3s;
  box-shadow:0 0 40px rgba(255,0,60,0.4);
  cursor:pointer;
}

/* Slice overlay */
.slice{
  position:absolute;
  left:0; top:0;
  width:100%; height:100%;
  background:url("images/Red-Velvet-Layer-Cake.jpg") center/cover no-repeat;
  border-radius:20px;
  clip-path:polygon(50% 0, 100% 0, 100% 100%, 50% 100%);
  transform-origin:left;
  transform:scaleX(0);
  transition:0.8s ease;
  pointer-events:none;
}

/* Shake animation */
@keyframes shake {
  0% { transform:rotate(0deg); }
  25% { transform:rotate(1deg); }
  50% { transform:rotate(-1.5deg); }
  75% { transform:rotate(1deg); }
  100% { transform:rotate(0deg); }
}

button{
  padding:12px 30px;border:none;border-radius:30px;cursor:pointer;
  background:linear-gradient(90deg,#ff2f4b,#ff6b81);color:white;font-weight:600;
  box-shadow:0 0 20px rgba(255,60,120,0.7);margin-top:28px;
}
button:hover{transform:scale(1.05);}

.confetti{
  position:fixed;
  width:14px;height:14px;
  background:pink;
  transform:rotate(45deg);
  border-radius:3px;
  animation:fall 2s linear forwards;
}

@keyframes fall {
  to { transform:translateY(800px) rotate(360deg); opacity:0; }
}
</style>
</head>
<body>

<audio id="bgMusic" loop>
  <source src="assets/music.mp3" type="audio/mpeg">
</audio>

<div class="content">
  <h1 id="title"></h1>
  <p>Click the cake to cut it 🎂💖</p>

  <div class="cakeBox">
    <img id="cakeImage" src="images/Red-Velvet-Layer-Cake.jpg">
    <div class="slice" id="slice"></div>
  </div>

  <button id="nextBtn" onclick="next()" style="display:none;">Next ➜</button>
</div>

<script>
// Restore name
var princess = localStorage.getItem("bdayName") || "My Love";
document.getElementById("title").innerText = "Happy Birthday " + princess + " ❤️";

// Music logic
const music = document.getElementById("bgMusic");
document.addEventListener("click", () => { music.volume = 0.4; music.play(); }, { once:true });

// Cut logic
let cut = false;
const cakeImage = document.getElementById("cakeImage");
const slice = document.getElementById("slice");
const nextBtn = document.getElementById("nextBtn");

cakeImage.addEventListener("click", () =>{
  if(cut) return;
  cut = true;

  cakeImage.style.animation = "shake 0.4s";

  // reveal slice
  setTimeout(() => {
    slice.style.transform = "scaleX(1)";
  }, 200);

  // show next button
  setTimeout(() => {
    nextBtn.style.display = "inline-block";
  }, 900);

  spawnConfetti();
});

// confetti hearts
function spawnConfetti(){
  for(let i=0;i<50;i++){
    let c = document.createElement("div");
    c.classList.add("confetti");
    c.style.left = Math.random()*window.innerWidth + "px";
    c.style.top = "-20px";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),2000);
  }
}

function next(){ window.location.href="album.html"; }
</script>

</body>
</html>
