<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Cake ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  height:100vh;
  background: radial-gradient(circle, #ff7aa8, #ff4f8b, #d60055);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  color:white;
  font-family:'Poppins',sans-serif;
}

h1{
  font-family:'Great Vibes',cursive;
  font-size:50px;
  text-shadow:0 0 18px rgba(255,100,150,1);
}

#cakeBox{
  width:260px;
  position:relative;
  cursor:pointer;
}

/* Cake Image */
#cakeFull{
  width:260px;
  transition:0.4s ease;
}

.half{
  position:absolute;
  width:50%;
  top:0;
  opacity:0;
  transition:0.7s ease;
}
#rightHalf{ left:50%; }

#nameTag{
  position:absolute;
  width:100%;
  bottom:20px;
  text-align:center;
  font-size:22px;
  color:white;
  font-weight:700;
  text-shadow:0 0 8px black;
  pointer-events:none;
}

button{
  margin-top:20px;
  display:none;
  padding:12px 24px;
  border-radius:30px;
  background:#ff4e84;
  color:white;
  font-size:17px;
  border:none;
  cursor:pointer;
}
button:hover{ transform:scale(1.1); }

.heart{
  position:fixed;
  font-size:28px;
  animation:floatUp 1.4s ease-out forwards;
}

@keyframes floatUp{
  0%{ opacity:1; transform:translateY(0) scale(1); }
  100%{ opacity:0; transform:translateY(-150px) scale(1.7); }
}
</style>
</head>
<body>

<h1 id="title"></h1>

<div id="cakeBox">

  <!-- FULL CAKE IMAGE -->
  <img id="cakeFull" src="images/cake.png">

  <!-- NAME ON CAKE -->
  <div id="nameTag"></div>

  <!-- LEFT HALF -->
  <img id="leftHalf" class="half" src="images/cake.png">

  <!-- RIGHT HALF -->
  <img id="rightHalf" class="half" src="images/cake.png">

</div>

<button id="nextBtn" onclick="next()">Next ➜</button>

<script>
// Get name
let girl = localStorage.getItem("bdayName") || "My Love";

// Title
document.getElementById("title").innerText = "Happy Birthday " + girl + " ❤️";

// Name on cake
document.getElementById("nameTag").innerText = girl;

// Cake split animation
let cut = false;

document.getElementById("cakeBox").addEventListener("click", () => {
  if(cut) return;
  cut = true;

  let full = document.getElementById("cakeFull");
  let left = document.getElementById("leftHalf");
  let right = document.getElementById("rightHalf");

  full.style.opacity = "0";

  left.style.opacity = "1";
  right.style.opacity = "1";

  left.style.transform = "translateX(-70px)";
  right.style.transform = "translateX(70px)";

  burstHearts();

  setTimeout(()=>{
    document.getElementById("nextBtn").style.display="inline-block";
  },700);
});

// Hearts effect
function burstHearts(){
  for(let i=0;i<15;i++){
    let h=document.createElement("div");
    h.className="heart";
    h.innerHTML="❤️";
    h.style.left=(window.innerWidth/2 + Math.random()*60 - 30) + "px";
    h.style.top=(window.innerHeight/2 - 50) + "px";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),1500);
  }
}

function next(){
  window.location.href = "album.html";
}
</script>

</body>
</html>
