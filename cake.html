<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cake ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/three@0.150.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.150.0/examples/js/controls/OrbitControls.js"></script>

<style>
body{
  margin:0;padding:0;
  height:100vh;width:100vw;
  background:url("assets/Heart-shape-tree-with-red-leaves-on-red-flower-field.jpg") center/cover no-repeat;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;color:#fff;font-family:'Poppins',sans-serif;
  position:relative;
}
body::after{
  content:"";position:absolute;inset:0;
  background:rgba(0,0,0,0.45);backdrop-filter:blur(2px);
}
.content{position:relative;z-index:10;}
h1{
  font-family:'Great Vibes',cursive;font-size:52px;margin-bottom:10px;
  color:#ffdce9;text-shadow:0 0 20px rgba(255,60,120,0.6);
}
p{margin-bottom:18px;color:#ffe5eb;}
#cakeCanvas{
  width:340px;height:340px;
  background:rgba(255,255,255,0.05);
  border-radius:50%;backdrop-filter:blur(5px);
  box-shadow:0 0 40px rgba(255,0,60,0.4);
}
button{
  padding:12px 30px;border:none;border-radius:30px;cursor:pointer;
  background:linear-gradient(90deg,#ff2f4b,#ff6b81);color:white;font-weight:600;
  box-shadow:0 0 20px rgba(255,60,120,0.7);margin-top:28px;
}
button:hover{transform:scale(1.05);}
</style>
</head>
<body>

<audio id="bgMusic" loop>
  <source src="assets/Sidu Sidu Song Ringtone Download Tamil Mp3 Naa Songs.mp3" type="audio/mpeg">
</audio>

<div class="content">
  <h1 id="title"></h1>
  <p>Here is your Red Velvet Cake 🎂 Rotate it with your finger 💕</p>
  <canvas id="cakeCanvas"></canvas>

  <button onclick="next()">Next ➜</button>
</div>

<script>
// Restore name
var princess = localStorage.getItem("bdayName") || "My Love";
document.getElementById("title").innerText = "Happy Birthday " + princess + " ❤️";

// Music logic
const music = document.getElementById("bgMusic");
document.addEventListener("click", () => { music.volume = 0.4; music.play(); }, { once:true });

// THREE.JS Cake
const canvas = document.getElementById("cakeCanvas");
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setSize(canvas.clientWidth, canvas.clientHeight);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, canvas.clientWidth/canvas.clientHeight, 0.1, 1000);
camera.position.set(0, 1.8, 3);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableZoom = false;

const light = new THREE.PointLight(0xffffff, 1.5);
light.position.set(3,4,3);
scene.add(light);

const baseGeo = new THREE.CylinderGeometry(1,1,0.7,64);
const frostingGeo = new THREE.CylinderGeometry(1.05,1.05,0.3,64);

const redVelvet = new THREE.MeshPhongMaterial({ color:"#a40028" });
const frosting = new THREE.MeshPhongMaterial({ color:"#fff2f4" });

const cakeBase = new THREE.Mesh(baseGeo, redVelvet);
scene.add(cakeBase);

const cakeTop = new THREE.Mesh(frostingGeo, frosting);
cakeTop.position.y = 0.5;
scene.add(cakeTop);

function animate(){
  cakeBase.rotation.y += 0.005;
  cakeTop.rotation.y += 0.005;
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
animate();

function next(){ window.location.href = "album.html"; }
</script>

</body>
</html>
