<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cake ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/controls/OrbitControls.js"></script>

<style>
body{
  margin:0;padding:0;
  height:100vh;width:100vw;
  background:url("images/Heart-shape-tree-with-red-leaves-on-red-flower-field.jpg") center/cover no-repeat;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;color:#fff;font-family:'Poppins',sans-serif;
  position:relative;
}
body::after{
  content:"";position:absolute;inset:0;
  background:rgba(0,0,0,0.45);backdrop-filter:blur(2px);
}
.content{position:relative;z-index:10;}
h1{
  font-family:'Great Vibes',cursive;font-size:52px;margin-bottom:10px;
  color:#ffdce9;text-shadow:0 0 20px rgba(255,60,120,0.6);
}
p{margin-bottom:18px;color:#ffe5eb;}
#cakeCanvas{
  width:330px;height:330px;
  background:rgba(255,255,255,0.08);
  border-radius:20px;
  box-shadow:0 0 40px rgba(255,0,60,0.4);
  backdrop-filter:blur(4px);
}
button{
  padding:12px 30px;border:none;border-radius:30px;cursor:pointer;
  background:linear-gradient(90deg,#ff2f4b,#ff6b81);color:white;font-weight:600;
  box-shadow:0 0 20px rgba(255,60,120,0.7);margin-top:28px;
  display:none;
}
button:hover{transform:scale(1.05);}

/* cute hearts */
.heart{
  position:fixed;
  color:pink;
  font-size:22px;
  animation:floatUp 1.8s ease-out forwards;
}
@keyframes floatUp {
  0% { opacity:1; transform:translateY(0) scale(1); }
  100% { opacity:0; transform:translateY(-140px) scale(1.8); }
}
</style>
</head>
<body>

<audio id="bgMusic" loop>
  <source src="assets/music.mp3" type="audio/mpeg">
</audio>

<div class="content">
  <h1 id="title"></h1>
  <p>Tap the cute cake to cut it 🎂💖</p>

  <canvas id="cakeCanvas"></canvas>

  <button id="nextBtn" onclick="next()">Next ➜</button>
</div>

<script>
// 🌸 Restore name
var princess = localStorage.getItem("bdayName") || "My Love";
document.getElementById("title").innerText = "Happy Birthday " + princess + " ❤️";

// 🎵 Music auto-play
const music = document.getElementById("bgMusic");
document.addEventListener("click", () => { music.volume = 0.4; music.play(); }, { once:true });

// 🎂 THREE.JS CAKE
const canvas = document.getElementById("cakeCanvas");
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setSize(canvas.clientWidth, canvas.clientHeight);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, canvas.clientWidth/canvas.clientHeight, 0.1, 100);
camera.position.set(0, 1.8, 4);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableZoom = false;

// 🌟 Lights
const light1 = new THREE.PointLight(0xffffff, 1.2);
light1.position.set(3,3,3);
scene.add(light1);
scene.add(new THREE.AmbientLight(0xffcce5, 0.6));

// 🧁 Cake Base
const baseGeo = new THREE.CylinderGeometry(1.2,1.2,0.7,64);
const baseMat = new THREE.MeshPhongMaterial({ color:"#ff6b81", shininess:40 });
const cakeBase = new THREE.Mesh(baseGeo, baseMat);
scene.add(cakeBase);

// 🧁 Frosting
const frostGeo = new THREE.CylinderGeometry(1.25,1.25,0.32,64);
const frostMat = new THREE.MeshPhongMaterial({ color:"#ffe4ec", shininess:80 });
const cakeFrost = new THREE.Mesh(frostGeo, frostMat);
cakeFrost.position.y = 0.38;
scene.add(cakeFrost);

// 🕯 Candle
const candleGeo = new THREE.CylinderGeometry(0.09,0.09,0.9,32);
const candleMat = new THREE.MeshPhongMaterial({ color:"#fffaf5" });
const candle = new THREE.Mesh(candleGeo, candleMat);
candle.position.y = 0.95;
scene.add(candle);

// 🔥 Flame
const flameGeo = new THREE.SphereGeometry(0.12, 32, 32);
const flameMat = new THREE.MeshBasicMaterial({ color:"#ffcf4d" });
const flame = new THREE.Mesh(flameGeo, flameMat);
flame.position.y = 1.35;
scene.add(flame);

// 🔪 Cut Animation
let cut = false;
let cutAngle = 0;

canvas.addEventListener("click", () => {
  if(cut) return;
  cut = true;
  heartBurst();

  const cutInterval = setInterval(() => {
    cutAngle += 0.04;
    cakeFrost.rotation.y = cutAngle;
    cakeBase.rotation.y = cutAngle;

    if(cutAngle >= Math.PI/3){
      clearInterval(cutInterval);
      document.getElementById("nextBtn").style.display = "inline-block";
    }
  }, 16);
});

// 💖 Floating hearts
function heartBurst(){
  for(let i=0;i<15;i++){
    let h = document.createElement("div");
    h.className = "heart";
    h.innerHTML = "❤️";
    h.style.left = (window.innerWidth/2 - 20 + Math.random()*80 - 40) + "px";
    h.style.top = (window.innerHeight/2 + 0) + "px";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),1800);
  }
}

// 🎞 Animation loop
function animate(){
  cakeBase.rotation.y += 0.003;
  cakeFrost.rotation.y += 0.003;
  flame.scale.y = 1 + Math.sin(Date.now()/120)*0.2;
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
animate();

function next(){
  window.location.href = "album.html";
}
</script>

</body>
</html>
