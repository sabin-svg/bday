<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Words For You 💖</title>
<style>
body{
  margin:0;height:100vh;
  background:radial-gradient(circle at bottom,#400000,#000);
  color:white;font-family:"Poppins",sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;overflow:hidden;
}
h1{color:#ff6b81;font-size:2.3em;margin-bottom:20px}
p{font-size:1.1em;max-width:600px;line-height:1.5;color:#ffd9d9}
button{margin-top:30px;padding:10px 20px;border:none;border-radius:10px;background:#ff6b81;color:white;font-weight:bold;cursor:pointer}
button:hover{background:#ff889d}
.heart{position:absolute;animation:float 6s linear infinite;opacity:0.6}
@keyframes float{0%{transform:translateY(100vh) scale(1);}100%{transform:translateY(-10vh) scale(1.5);opacity:0;}}
</style>
</head>
<body>
<h1 id="title"></h1>
<p>
You are not just my love,<br>
you are my reason to smile every single day.<br>
I don’t need a perfect world,<br>
I just need you in mine.<br><br>
Happy Birthday, <span id="name"></span>❤️<br>
From your one and only — Sabin 💞
</p>
<button onclick="restart()">Replay From Start 🔁</button>
<audio id="music" loop autoplay>
<!-- later add: <source src="princess.mp3" type="audio/mpeg"> -->
</audio>
<script>
const name=localStorage.getItem("bdayName")||"Princess";
document.getElementById("name").textContent=name;
document.getElementById("title").textContent="For You, "+name;

function restart(){
  localStorage.removeItem("bdayName");
  window.location.href="index.html";
}

// floating hearts
for(let i=0;i<30;i++){
  const span=document.createElement('span');
  span.textContent='❤️';
  span.classList.add('heart');
  span.style.left=Math.random()*100+'vw';
  span.style.animationDelay=Math.random()*5+'s';
  span.style.fontSize=Math.random()*20+20+'px';
  document.body.appendChild(span);
}
</script>
</body>
</html>
