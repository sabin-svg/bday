<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
<style>
body{
  margin:0;height:100vh;width:100vw;text-align:center;
  background:radial-gradient(circle at center,#680010,#1b0005);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:white;font-family:'Poppins',sans-serif;
}
h1{
  font-family:'Great Vibes',cursive;
  font-size:60px;margin-bottom:20px;
  color:#ffb8c7;text-shadow:0 0 30px rgba(255,80,120,0.7);
}
p{max-width:600px;font-size:20px;line-height:1.6;color:#ffe6eb;}
button{
  margin-top:30px;padding:12px 28px;border:none;border-radius:30px;
  background:linear-gradient(90deg,#ff2f4b,#ff6b81);
  color:white;font-weight:600;cursor:pointer;
  box-shadow:0 0 20px rgba(255,80,120,0.7);
}
button:hover{transform:scale(1.05);}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;}
</style>
</head>
<body>

<audio id="bgMusic" loop autoplay>
  <source src="assets/music.mp3" type="audio/mpeg">
</audio>

<canvas id="fx"></canvas>

<h1 id="nameTitle"></h1>

<p id="msg"></p>

<button onclick="again()">Replay From Start 🔁</button>

<script>
let n = localStorage.getItem("bdayName") || "My Love";
document.getElementById("nameTitle").innerText = "For You, " + n + " ❤️";

let text = [
  "You know what?",
  "You're not just special...",
  "You’re my favorite person.",
  "My safe place.",
  "My calm.",
  "My happiness.",
  "My cutest problem and sweetest solution 😉❤️"
];

let i=0;
function type(){
  if(i<text.length){
    document.getElementById("msg").innerText += text[i] + "\n\n";
    i++;
    setTimeout(type,900);
  }
}
type();

function again(){
  localStorage.removeItem("bdayName");
  window.location.href="index.html";
}

// floating hearts
const c = fx, ctx = c.getContext("2d");
let W,H;function resize(){W=c.width=innerWidth;H=c.height=innerHeight;}resize();
window.onresize=resize;

let hearts=[];
function heart(){
  return {x:Math.random()*W,y:H,vx:(Math.random()-0.5)*2,vy:-2-Math.random()*3,size:10+Math.random()*14};
}
setInterval(()=>hearts.push(heart()),130);

function animate(){
  ctx.clearRect(0,0,W,H);
  hearts.forEach((h,i)=>{
    h.x+=h.vx;h.y+=h.vy;
    ctx.fillStyle="pink";
    ctx.beginPath();
    ctx.arc(h.x,h.y,h.size,0,Math.PI*2);
    ctx.fill();
    if(h.y<-20)hearts.splice(i,1);
  });
  requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
