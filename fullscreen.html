<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>For My Princess — Surprise</title>

<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/controls/OrbitControls.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#ff2f4b;
    --rose:#ff6b81;
    --cream:#fff7f7;
    --bg-dark:#200004;
  }
  html,body{height:100%;margin:0;font-family:'Poppins',sans-serif;background:var(--bg-dark);color:white;overflow:hidden}
  /* full-screen pages container */
  .pages{height:100vh;width:100vw;display:flex;flex-direction:column;scroll-snap-type:y mandatory;overflow-y:auto; -webkit-overflow-scrolling:touch;}
  section{height:100vh;min-height:600px;width:100%;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;padding:30px;box-sizing:border-box}

  /* NAV */
  .nav{
    position:fixed;left:20px;top:20px;z-index:999;display:flex;gap:8px;
  }
  .nav button{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.06);color:var(--cream);padding:8px 12px;border-radius:999px;backdrop-filter:blur(6px);cursor:pointer}
  .nav button:hover{transform:scale(1.03)}

  /* PAGE 1: Cover */
  .cover{
    background: center / cover no-repeat url("assets/Heart-shape-tree-with-red-leaves-on-red-flower-field.jpg");
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    gap:12px;
  }
  .cover .title{font-family:'Great Vibes',cursive;font-size:clamp(36px,6vw,92px);color:var(--cream);text-shadow:0 8px 40px rgba(255,80,100,0.45)}
  .cover .sub{color:rgba(255,230,230,0.9);font-size:18px}

  /* translucent card UI center */
  .card{
    background:linear-gradient(180deg,rgba(255,255,255,0.06),rgba(255,255,255,0.02));
    border-radius:18px;padding:18px 22px;box-shadow:0 10px 40px rgba(0,0,0,0.6);backdrop-filter:blur(6px);
  }

  /* PAGE 2: Cake area */
  #cakePage{display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center}
  #threeCanvas{width:80vw;height:60vh;max-width:1100px;border-radius:14px;box-shadow:0 18px 80px rgba(0,0,0,0.7);background:linear-gradient(180deg,#2b0000,#120003)}
  .cake-cta{display:flex;gap:12px;align-items:center}

  .btn{padding:10px 18px;border-radius:999px;border:none;color:white;background:linear-gradient(90deg,var(--red),var(--rose));cursor:pointer;font-weight:600;box-shadow:0 10px 30px rgba(255,75,100,0.2)}
  .btn.secondary{background:transparent;border:1px solid rgba(255,255,255,0.06)}

  /* PAGE 3: Flip album */
  .album{width:clamp(320px,70vw,900px);height:70vh;max-height:820px;display:flex;align-items:center;justify-content:center;position:relative}
  .flip-card{width:60%;height:80%;position:relative;perspective:1600px;display:flex;align-items:center;justify-content:center}
  .flip-inner{position:absolute;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.9,.25,1)}
  .flip-inner.showBack{transform:rotateY(180deg)}
  .flip-face{position:absolute;inset:0;border-radius:14px;overflow:hidden;backface-visibility:hidden;box-shadow:0 18px 50px rgba(0,0,0,0.6)}
  .flip-face img{width:100%;height:100%;object-fit:cover;display:block}
  .flip-back{transform:rotateY(180deg;background:linear-gradient(180deg,#fff0 0,#fff0 100%)}
  .album-controls{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px}

  /* PAGE 4: Final reveal */
  .final{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
  .quote{font-family:'Great Vibes',cursive;font-size:clamp(28px,5vw,56px);color:var(--cream);text-shadow:0 8px 40px rgba(255,60,90,0.5)}
  .typewriter{font-size:20px;color:#ffecec;max-width:800px;text-align:center}

  /* small common helper */
  .muted{color:rgba(255,230,230,0.8)}
  /* responsive tweaks */
  @media (max-width:720px){ .flip-card{width:86%;height:64vh} .album-controls{right:10px;bottom:8px} }
</style>
</head>
<body>

<!-- top nav -->
<div class="nav">
  <button onclick="goTo(0)">Cover</button>
  <button onclick="goTo(1)">Cake</button>
  <button onclick="goTo(2)">Album</button>
  <button onclick="goTo(3)">Final</button>
</div>

<!-- pages -->
<div class="pages" id="pages">
  <!-- Page1: Cover -->
  <section class="cover">
    <div class="card">
      <div class="title">For You, My Princess ❤️</div>
      <div class="sub">A red & white day — open each page, one surprise at a time</div>
      <div style="margin-top:8px">
        <button class="btn" onclick="goTo(1)">Open Cake 🎂</button>
        <button class="btn secondary" onclick="goTo(2)">Flip Album 📸</button>
      </div>
    </div>
  </section>

  <!-- Page2: Cake -->
  <section id="cakePage">
    <div style="text-align:center">
      <div style="font-size:28px;font-weight:600;margin-bottom:6px;color:var(--cream)">A Red-Velvet Cake (3D)</div>
      <div class="muted">Tap/click the cake to cut it — confetti will follow</div>
    </div>
    <div id="threeCanvas" class="card"></div>
    <div class="cake-cta">
      <button class="btn" id="cutBtn">Cut Cake ✂️</button>
      <button class="btn secondary" onclick="goTo(2)">Open Album →</button>
    </div>
  </section>

  <!-- Page3: Flip Album -->
  <section style="display:flex;flex-direction:column;align-items:center;justify-content:center">
    <h2 style="margin-bottom:10px;color:var(--rose)">Flip Album — one photo per page</h2>
    <div class="album card">
      <div class="flip-card" id="flipCard">
        <div class="flip-inner" id="flipInner">
          <div class="flip-face front">
            <img id="photoFront" src="assets/hand-holding-in-love.jpg" alt="front photo">
          </div>
          <div class="flip-face flip-back back">
            <img id="photoBack" src="assets/VD1071_main_hd.webp" alt="back photo">
          </div>
        </div>
      </div>

      <div class="album-controls">
        <button class="btn secondary" id="prevBtn">◀</button>
        <button class="btn" id="nextBtn">▶</button>
      </div>
    </div>
    <div style="margin-top:14px" class="muted">Swipe left/right (mobile) or use arrows / buttons</div>
  </section>

  <!-- Page4: Final Reveal -->
  <section class="final">
    <div class="quote">For my everything — today and always.</div>
    <div class="typewriter" id="typewriter"></div>
    <div style="margin-top:10px">
      <button class="btn" onclick="restart()">Play Again 🔁</button>
    </div>
  </section>
</div>

<!-- heart particle canvas -->
<canvas id="hearts" style="position:fixed;inset:0;pointer-events:none;z-index:5"></canvas>

<!-- background music -->
<audio id="bgMusic" loop crossorigin="anonymous">
  <source src="assets/Sidu Sidu Song Ringtone Download Tamil Mp3 Naa Songs.mp3" type="audio/mpeg">
  <!-- If your MP3 filename has spaces, it still works locally; if serving from a server rename to music.mp3 -->
</audio>

<script>
/* =========== Smooth page navigation =========== */
const pages = document.getElementById('pages');
function goTo(n){
  pages.scrollTo({ top: n * window.innerHeight, behavior: 'smooth' });
}

/* auto-play music (try) */
const bg = document.getElementById('bgMusic');
function tryPlayMusic(){
  bg.volume = 0.28;
  bg.play().catch(()=>{/* user gesture required */});
}
window.addEventListener('click', tryPlayMusic, { once: true });

/* =========== Three.js cake scene =========== */
(function initThree(){
  const container = document.getElementById('threeCanvas');
  const scene = new THREE.Scene();
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  container.appendChild(renderer.domElement);

  const camera = new THREE.PerspectiveCamera(35, 2, 0.1, 100);
  camera.position.set(0, 2.2, 6);

  // lights
  const amb = new THREE.AmbientLight(0xffffff, 0.55);
  scene.add(amb);
  const rim = new THREE.DirectionalLight(0xffc8d1, 0.55);
  rim.position.set(-4,6,2);
  scene.add(rim);
  const key = new THREE.DirectionalLight(0xffffff,0.6);
  key.position.set(4,4,6);
  scene.add(key);

  // table plane
  const planeGeo = new THREE.CircleGeometry(5.2, 64);
  const planeMat = new THREE.MeshStandardMaterial({color:0x2b0000, roughness:0.8, metalness:0});
  const plane = new THREE.Mesh(planeGeo, planeMat);
  plane.rotation.x = -Math.PI/2; plane.position.y = -0.01;
  scene.add(plane);

  // helper for layered red velvet cake: 2 tiers (cylinders)
  function makeTier(radius, height, y, frostingColor, cakeColor){
    const cakeMat = new THREE.MeshStandardMaterial({
      color: cakeColor,
      roughness: 0.75,
      metalness: 0.05,
    });
    const cylinder = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, height, 64), cakeMat);
    cylinder.position.y = y;
    // subtle top cream (torus-like rim)
    const creamMat = new THREE.MeshStandardMaterial({color:frostingColor, roughness:0.25, metalness:0.05});
    const cream = new THREE.Mesh(new THREE.CylinderGeometry(radius*0.98, radius*0.98, height*0.18, 64), creamMat);
    cream.position.y = y + height*0.45;
    // add slight noise via vertex displacement (cheap)
    cylinder.receiveShadow = cream.receiveShadow = true;
    scene.add(cylinder, cream);
    return {cylinder, cream};
  }

  // colors: deep red cake, ivory cream
  const cakeRed = 0x8f0016; // dark red (interior)
  const velvet = 0xb71c31; // brighter velvet surface
  const cream = 0xfff7f5;

  // bottom tier
  const bottom = makeTier(1.6, 1.2, 0.7, cream, velvet);
  // top tier
  const top = makeTier(1.0, 0.9, 1.75, cream, velvet);

  // topper: rotating heart
  const heartShape = new THREE.Shape();
  heartShape.moveTo(0, 0.25);
  heartShape.bezierCurveTo(0,0.9, -1.2,0.9, -1.2,0.1);
  heartShape.bezierCurveTo(-1.2,-0.6, 0.2,-1.1, 0, -1.6);
  heartShape.bezierCurveTo(0.2,-1.1, 1.2,-0.6, 1.2,0.1);
  heartShape.bezierCurveTo(1.2,0.9, 0,0.9, 0,0.25);
  const extrudeSettings = { depth: 0.25, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.06, bevelSegments: 4 };
  const heartGeo = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
  heartGeo.center();
  const heartMat = new THREE.MeshStandardMaterial({ color: 0xff2f4b, metalness:0.15, roughness:0.32});
  const heart = new THREE.Mesh(heartGeo, heartMat);
  heart.scale.set(0.45,0.45,0.45);
  heart.position.set(0, 2.45, 0);
  scene.add(heart);

  // subtle camera controls (orbit)
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enablePan=false; controls.enableZoom=true; controls.minDistance=3; controls.maxDistance=12;
  controls.target.set(0,1.1,0);

  // handle resize
  function onResize(){
    const w = container.clientWidth;
    const h = container.clientHeight;
    renderer.setSize(w, h);
    camera.aspect = w/h; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', onResize);
  onResize();

  // cake cut interaction: simple scale + confetti
  const cutBtn = document.getElementById('cutBtn');
  let cut = false;
  cutBtn.addEventListener('click', ()=>cutCake());
  container.addEventListener('click', ()=>cutCake());
  function cutCake(){
    if(cut) return; cut=true;
    // animate top tier slightly down + reveal "slice" (simple rotation)
    const tlDuration = 800;
    const start = performance.now();
    const s0 = top.cylinder.rotation.z;
    (function animateCut(t){
      let p = Math.min(1, (t-start)/tlDuration);
      top.cylinder.rotation.z = s0 + p * 0.5;
      top.cream.rotation.z = s0 + p * 0.5;
      heart.rotation.y += 0.08;
      if(p<1) requestAnimationFrame(animateCut);
      else spawnConfetti(160);
    })(start);
  }

  /* simple confetti using DOM canvas overlay later (reused) */
  window.spawnConfetti = function(n=100){
    // emit hearts via heartsCanvas
    const hearts = window.heartSystem;
    if(hearts) hearts.emit(n);
  };

  // animate
  const clock = new THREE.Clock();
  function animate(){
    const t = clock.getElapsedTime();
    heart.rotation.y = 0.6 * Math.sin(t*0.9);
    bottom.cylinder.rotation.y = Math.sin(t*0.2)*0.02;
    top.cylinder.rotation.y = -Math.sin(t*0.18)*0.02;
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }
  animate();
})();

/* =========== Heart particle / confetti canvas =========== */
(function heartsCanvas(){
  const canvas = document.getElementById('hearts');
  const ctx = canvas.getContext('2d');
  let W = canvas.width = innerWidth, H = canvas.height = innerHeight;
  window.addEventListener('resize', ()=>{ W = canvas.width = innerWidth; H = canvas.height = innerHeight; });

  function Heart(){
    this.x = Math.random()*W;
    this.y = -20 - Math.random()*200;
    this.vx = (Math.random()-0.5) * 2;
    this.vy = 1 + Math.random()*3;
    this.size = 6 + Math.random()*18;
    this.life = 0;
    this.max = 350 + Math.random()*250;
    this.h = 345 + Math.random()*20;
  }
  Heart.prototype.update = function(i, arr){
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.02; // gravity
    this.life++;
    if(this.y > H + 50 || this.life > this.max) { arr.splice(i,1); }
  };
  Heart.prototype.draw = function(){
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(Math.sin(this.x*0.01 + this.y*0.01) * 0.7);
    const s = this.size;
    ctx.fillStyle = `hsl(${this.h}, 85%, 60%)`;
    // draw simple heart path
    ctx.beginPath();
    ctx.moveTo(0, -s/2);
    ctx.bezierCurveTo(-s, -s*1.3, -s*1.3, s*0.2, 0, s);
    ctx.bezierCurveTo(s*1.3, s*0.2, s, -s*1.3, 0, -s/2);
    ctx.fill();
    ctx.restore();
  };

  const pool = [];
  function loop(){
    ctx.clearRect(0,0,W,H);
    for(let i=0;i<pool.length;i++){ pool[i].update(i,pool); pool[i].draw(); }
    requestAnimationFrame(loop);
  }
  loop();

  const system = {
    emit(n){
      for(let i=0;i<n;i++){ pool.push(new Heart()); }
    }
  };
  window.heartSystem = system;
})();

/* =========== Flip album logic (page-wise flip) =========== */
(function flipAlbum(){
  const photos = [
    "assets/hand-holding-in-love.jpg",
    "assets/VD1071_main_hd.webp",
    // optional additional placeholders - looks for photo3.jpg..photo8.jpg
    "assets/photo3.jpg","assets/photo4.jpg","assets/photo5.jpg","assets/photo6.jpg","assets/photo7.jpg","assets/photo8.jpg"
  ];
  // filter only existing images (attempt by preloading)
  let loaded = [];
  let idx = 0;
  function preloadList(list, cb){
    let count = 0;
    list.forEach((src,i)=>{
      const img = new Image();
      img.onload = ()=>{ loaded.push(src); count++; if(count>=list.length) cb(); };
      img.onerror = ()=>{ count++; if(count>=list.length) cb(); };
      img.src = src;
    });
  }
  preloadList(photos, () => {
    // if loaded array empty, still show placeholders referencing existing ones earlier
    if(loaded.length === 0){
      loaded = photos.slice(0,2);
    }
    // set initial two images
    const front = document.getElementById('photoFront');
    const back = document.getElementById('photoBack');
    front.src = loaded[0] || photos[0];
    back.src = loaded[1] || photos[1];
    // previous / next
    const flipInner = document.getElementById('flipInner');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    let current = 0;
    function show(i){
      // determine front/back images based on current index
      const a = loaded[i % loaded.length];
      const b = loaded[(i+1) % loaded.length];
      document.getElementById('photoFront').src = a;
      document.getElementById('photoBack').src = b;
      // reset flip
      flipInner.classList.remove('showBack');
    }
    prevBtn.addEventListener('click', ()=>{
      current = (current - 1 + loaded.length) % loaded.length;
      // swap so it flips backward
      document.getElementById('photoBack').src = loaded[current];
      flipInner.classList.add('showBack');
      setTimeout(()=>{ show(current); }, 600);
    });
    nextBtn.addEventListener('click', ()=>{
      // flip to next
      flipInner.classList.add('showBack');
      setTimeout(()=>{ current = (current + 1) % loaded.length; show(current); }, 600);
    });

    // touch swipe
    let startX = 0;
    const flipCard = document.getElementById('flipCard');
    flipCard.addEventListener('pointerdown', (e)=> startX = e.clientX );
    flipCard.addEventListener('pointerup', (e)=>{
      const dx = e.clientX - startX;
      if(dx < -30) nextBtn.click();
      if(dx > 30) prevBtn.click();
    });
  });
})();

/* =========== Typewriter final reveal =========== */
(function finalType(){
  const el = document.getElementById('typewriter');
  const lines = [
    "Every heartbeat of mine whispers your name.",
    "You are my home, my sun, my sweetest dream.",
    "Happy Birthday — I love you, now and forever. ❤️"
  ];
  let li=0, ci=0;
  function type(){
    if(li >= lines.length) return;
    const txt = lines[li];
    el.textContent = txt.slice(0, ci);
    ci++;
    if(ci <= txt.length){
      setTimeout(type, 40 + Math.random()*30);
    } else {
      li++; ci=0;
      // small pause then next line
      setTimeout(type, 700);
      // trigger hearts on final line
      if(li === lines.length) setTimeout(()=>window.spawnConfetti(200), 500);
    }
  }
  // start typing when final page is reached
  const pagesEl = document.getElementById('pages');
  pagesEl.addEventListener('scroll', ()=>{
    const pageIndex = Math.round(pagesEl.scrollTop / window.innerHeight);
    if(pageIndex === 3 && el.textContent === "") type();
  });
})();

/* =========== small helpers =========== */
function restart(){
  location.href = location.href.split('#')[0];
  window.scrollTo({top:0,behavior:'smooth'});
  // restart music
  try{ document.getElementById('bgMusic').currentTime = 0; document.getElementById('bgMusic').play(); }catch(e){}
}

/* attempt autoplay once when loaded */
window.addEventListener('load', ()=>{ tryPlayMusic(); });
</script>
</body>
</html>
